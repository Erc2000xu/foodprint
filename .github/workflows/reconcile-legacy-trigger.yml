name: Reconcile legacy archive trigger

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RECONCILE_LEGACY_TRIGGER to apply the one-time trigger recovery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foodprint-production-legacy-trigger-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Require an intentional recovery from main
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Legacy recovery must be manually started from the main branch."
            exit 1
          fi
          if [ "$RECOVERY_CONFIRMATION" != "RECONCILE_LEGACY_TRIGGER" ]; then
            echo "::error::Enter RECONCILE_LEGACY_TRIGGER exactly to confirm this one-time schema recovery."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Verify repository secrets
        shell: bash
        run: |
          failed=0
          for setting in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository Actions secret: ${setting}"
              failed=1
            fi
          done
          exit "$failed"
      - name: Reconcile the precise legacy trigger
        run: node scripts/reconcile-legacy-trigger.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Dump the production public schema (read-only)
        run: supabase db dump --linked --schema public --file "$RUNNER_TEMP/foodprint-production-public-schema.sql"
      - name: Verify legacy migration requirements
        run: node scripts/verify-legacy-migration-state.mjs "$RUNNER_TEMP/foodprint-production-public-schema.sql"
      - name: Verify the legacy archive trigger from the production catalog (read-only)
        run: node scripts/verify-legacy-trigger-state.mjs
