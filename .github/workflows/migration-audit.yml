name: Audit production migration history

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodprint-production-migration-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Verify repository secrets
        shell: bash
        run: |
          failed=0
          for setting in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository Actions secret: ${setting}"
              failed=1
            fi
          done
          exit "$failed"
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: List local and remote migration history
        run: supabase migration list
      - name: Record V2.4.2 production backfill aggregates (read-only)
        shell: bash
        run: |
          SUPABASE_TELEMETRY_DISABLED=1 supabase db query --linked "
            with migration_cutoff as (
              select timestamptz '2026-08-28T09:36:41.343Z' as started_at
            )
            select
              (select count(*)
                 from public.visit_records as visit_record
                 join public.visits as legacy_visit
                   on legacy_visit.id = visit_record.legacy_visit_id
                 cross join migration_cutoff
                where visit_record.created_at < migration_cutoff.started_at
                  and legacy_visit.price_per_person is not null
                  and legacy_visit.price_per_person >= 1
                  and legacy_visit.price_per_person <= 99999
                  and round(legacy_visit.price_per_person, 2) = legacy_visit.price_per_person
              ) as deterministic_backfill_candidates,
              (select count(*)
                 from public.visit_records as visit_record
                 join public.visits as legacy_visit
                   on legacy_visit.id = visit_record.legacy_visit_id
                 cross join migration_cutoff
                where visit_record.created_at < migration_cutoff.started_at
                  and visit_record.price_per_person is not null
                  and legacy_visit.price_per_person is not null
                  and legacy_visit.price_per_person >= 1
                  and legacy_visit.price_per_person <= 99999
                  and round(legacy_visit.price_per_person, 2) = legacy_visit.price_per_person
              ) as deterministic_backfill_applied,
              (select count(*)
                 from public.visit_records as visit_record
                 join public.visits as legacy_visit
                   on legacy_visit.id = visit_record.legacy_visit_id
                 cross join migration_cutoff
                where visit_record.created_at < migration_cutoff.started_at
                  and visit_record.price_per_person is null
                  and legacy_visit.price_per_person is not null
                  and legacy_visit.price_per_person >= 1
                  and legacy_visit.price_per_person <= 99999
                  and round(legacy_visit.price_per_person, 2) = legacy_visit.price_per_person
              ) as deterministic_backfill_missing,
              (select count(*)
                 from public.visit_records
                where price_per_person is not null
              ) as priced_visit_records_total;
          "
