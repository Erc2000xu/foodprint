name: Release production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PRODUCTION to release the selected main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foodprint-production-release
  cancel-in-progress: false

jobs:
  verify-release-request:
    runs-on: ubuntu-latest
    env:
      RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require an intentional production release
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Production releases must be manually started from the main branch."
            exit 1
          fi
          if [ "$RELEASE_CONFIRMATION" != "DEPLOY_PRODUCTION" ]; then
            echo "::error::Enter DEPLOY_PRODUCTION exactly to confirm this release."
            exit 1
          fi
          if [ "$RELEASE_AUTOMATION_ENABLED" != "true" ]; then
            echo "::error::Release automation is intentionally disabled until the migration-history audit, repository secrets, and Vercel deploy hook are configured."
            exit 1
          fi

  verify-release-candidate:
    needs: verify-release-request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate release candidate
        run: npm run check

  verify-migration-integrity:
    needs: verify-release-request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Build a clean local Supabase database
        run: supabase db start
      - name: Reapply every committed migration
        run: supabase db reset --local --no-seed

  deploy-production:
    needs:
      - verify-release-candidate
      - verify-migration-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify repository secrets
        shell: bash
        run: |
          failed=0
          for setting in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID VERCEL_DEPLOY_HOOK; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository Actions secret: ${setting}"
              failed=1
            fi
          done
          exit "$failed"
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Show the production migration plan
        run: supabase db push --dry-run
      - name: Apply pending production migrations
        run: supabase db push
      - name: Deploy Edge Functions to production
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Trigger the Vercel production deployment
        run: curl --fail --silent --show-error --retry 2 --retry-all-errors --request POST "$VERCEL_DEPLOY_HOOK" --output /dev/null
