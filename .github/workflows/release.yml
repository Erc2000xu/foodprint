name: Release production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PRODUCTION to release the selected main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: foodprint-production-release
  cancel-in-progress: false

jobs:
  verify-release-request:
    runs-on: ubuntu-latest
    env:
      RELEASE_AUTOMATION_ENABLED: ${{ vars.RELEASE_AUTOMATION_ENABLED }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require an intentional production release
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Production releases must be manually started from the main branch."
            exit 1
          fi
          if [ "$RELEASE_CONFIRMATION" != "DEPLOY_PRODUCTION" ]; then
            echo "::error::Enter DEPLOY_PRODUCTION exactly to confirm this release."
            exit 1
          fi
          if [ "$RELEASE_AUTOMATION_ENABLED" != "true" ]; then
            echo "::error::Set RELEASE_AUTOMATION_ENABLED=true only after the one-time release setup is complete."
            exit 1
          fi

  verify-release-candidate:
    needs: verify-release-request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://foodprint.com.cn
      NEXT_PUBLIC_MAP_PROVIDER: amap
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_ICP_RECORD: ${{ vars.PRODUCTION_NEXT_PUBLIC_ICP_RECORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the confirmed ICP record
        run: npm run verify:icp -- --required
      - name: Validate release candidate
        run: npm run check
      - name: Install Chromium and WebKit for browser gates
        run: npx playwright install --with-deps chromium webkit
      - name: Run real browser upload and PWA gates
        run: npm run test:e2e

  verify-migration-integrity:
    needs: verify-release-request
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Build a clean local Supabase database
        run: supabase db start
      - name: Reapply every committed migration
        run: supabase db reset --local --no-seed

  deploy-production:
    needs:
      - verify-release-candidate
      - verify-migration-integrity
    runs-on: ubuntu-latest
    # Observed Tencent Cloud bundle uploads can exceed 90 minutes on the slow path.
    # Keep a bounded headroom while the transfer step resumes partial uploads.
    timeout-minutes: 180
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TENCENT_HOST: ${{ secrets.TENCENT_HOST }}
      TENCENT_PORT: ${{ vars.TENCENT_PORT }}
      TENCENT_DEPLOY_USER: ${{ secrets.TENCENT_DEPLOY_USER }}
      TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
      TENCENT_KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
      PRODUCTION_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_NEXT_PUBLIC_SUPABASE_URL }}
      PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      PRODUCTION_NEXT_PUBLIC_ICP_RECORD: ${{ vars.PRODUCTION_NEXT_PUBLIC_ICP_RECORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release credentials
        shell: bash
        run: |
          failed=0
          for setting in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID TENCENT_HOST TENCENT_DEPLOY_USER TENCENT_SSH_PRIVATE_KEY TENCENT_KNOWN_HOSTS PRODUCTION_NEXT_PUBLIC_SUPABASE_URL PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY PRODUCTION_NEXT_PUBLIC_ICP_RECORD; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository secret or variable: ${setting}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Configure SSH trust
        shell: bash
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$TENCENT_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$TENCENT_SSH_PRIVATE_KEY" | ssh-add -

      - name: Preflight Tencent Cloud target before production writes
        env:
          TENCENT_PORT: ${{ vars.TENCENT_PORT || '22' }}
        run: |
          ssh -p "$TENCENT_PORT" "$TENCENT_DEPLOY_USER@$TENCENT_HOST" \
            'sudo -n /usr/local/sbin/foodprint-install-release --check'

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Show the production migration plan
        run: supabase db push --dry-run
      - name: Apply pending production migrations
        run: supabase db push
      - name: Deploy the production POI Edge Function
        run: supabase functions deploy amap-poi-search --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - uses: docker/setup-buildx-action@v3
      - name: Build immutable production image
        env:
          IMAGE_TAG: foodprint:${{ github.sha }}
        run: |
          docker build \
            --load \
            --build-arg NEXT_PUBLIC_APP_URL=https://foodprint.com.cn \
            --build-arg NEXT_PUBLIC_MAP_PROVIDER=amap \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$PRODUCTION_NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PRODUCTION_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg NEXT_PUBLIC_ICP_RECORD="$PRODUCTION_NEXT_PUBLIC_ICP_RECORD" \
            --build-arg DEPLOYMENT_VERSION="${{ github.sha }}" \
            --tag "$IMAGE_TAG" \
            .

      - name: Package release bundle
        env:
          IMAGE_TAG: foodprint:${{ github.sha }}
          RELEASE_BUNDLE: foodprint-release-${{ github.sha }}.tgz
        run: |
          mkdir -p release-bundle/deploy/nginx
          docker save "$IMAGE_TAG" > release-bundle/foodprint-image.tar
          cp deploy/compose.production.yml release-bundle/deploy/compose.production.yml
          cp deploy/nginx/foodprint-http.conf release-bundle/deploy/nginx/foodprint-http.conf
          cp deploy/nginx/foodprint.conf release-bundle/deploy/nginx/foodprint.conf
          tar -czf "$RELEASE_BUNDLE" -C release-bundle \
            foodprint-image.tar \
            deploy/compose.production.yml \
            deploy/nginx/foodprint-http.conf \
            deploy/nginx/foodprint.conf

      - name: Upload release bundle
        env:
          RELEASE_BUNDLE: foodprint-release-${{ github.sha }}.tgz
          TENCENT_PORT: ${{ vars.TENCENT_PORT || '22' }}
        run: |
          ssh -p "$TENCENT_PORT" "$TENCENT_DEPLOY_USER@$TENCENT_HOST" \
            'mkdir -p /opt/foodprint/incoming && chmod 0750 /opt/foodprint/incoming'
          local_size="$(stat -c '%s' "$RELEASE_BUNDLE")"
          local_partial="${RELEASE_BUNDLE}.partial"
          remote_partial="/opt/foodprint/incoming/${local_partial}"
          # OpenSSH sftp requires put's remote path to be a directory. Give the
          # local temporary copy a unique name so the remote partial can be
          # resumed, then rename it only after the byte-size check passes.
          cp -- "$RELEASE_BUNDLE" "$local_partial"
          trap 'rm -f -- "$local_partial"' EXIT
          upload_ok=0
          for attempt in 1 2 3; do
            sftp_command='put'
            if ssh -p "$TENCENT_PORT" \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "$TENCENT_DEPLOY_USER@$TENCENT_HOST" \
              "test -f '$remote_partial'"; then
              sftp_command='put -a'
            fi
            if printf '%s %s /opt/foodprint/incoming/\n' \
              "$sftp_command" "$local_partial" |
              sftp -P "$TENCENT_PORT" \
                -o BatchMode=yes \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=10 \
                -b - "$TENCENT_DEPLOY_USER@$TENCENT_HOST"; then
              remote_size="$(ssh -p "$TENCENT_PORT" \
                -o ConnectTimeout=20 \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=10 \
                "$TENCENT_DEPLOY_USER@$TENCENT_HOST" \
                "stat -c '%s' '$remote_partial'" 2>/dev/null || true)"
              if [[ "$remote_size" == "$local_size" ]]; then
                ssh -p "$TENCENT_PORT" \
                  -o ConnectTimeout=20 \
                  -o ServerAliveInterval=30 \
                  -o ServerAliveCountMax=10 \
                  "$TENCENT_DEPLOY_USER@$TENCENT_HOST" \
                  "mv -f '$remote_partial' '/opt/foodprint/incoming/$RELEASE_BUNDLE'"
                upload_ok=1
                echo "release bundle upload verified: ${local_size} bytes"
                break
              fi
              echo "release bundle size mismatch on attempt ${attempt}: local=${local_size} remote=${remote_size}" >&2
            else
              echo "release bundle transfer attempt ${attempt} did not complete; retrying resumable upload" >&2
            fi
            sleep 10
          done
          [[ "$upload_ok" -eq 1 ]] || {
            echo 'release bundle upload did not reach the verified remote size' >&2
            exit 1
          }

      - name: Install release on Tencent Cloud
        env:
          RELEASE_BUNDLE: foodprint-release-${{ github.sha }}.tgz
          TENCENT_PORT: ${{ vars.TENCENT_PORT || '22' }}
        run: |
          ssh -p "$TENCENT_PORT" "$TENCENT_DEPLOY_USER@$TENCENT_HOST" \
            "sudo -n /usr/local/sbin/foodprint-install-release '${{ github.sha }}' '/opt/foodprint/incoming/$RELEASE_BUNDLE'"

      - name: Verify the public production endpoint
        run: |
          health_json="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --connect-timeout 10 --max-time 20 \
            https://foodprint.com.cn/api/health)"
          HEALTH_JSON="$health_json" EXPECTED_VERSION="${{ github.sha }}" node -e '
            const payload = JSON.parse(process.env.HEALTH_JSON ?? "{}");
            if (payload.status !== "ok" || payload.version !== process.env.EXPECTED_VERSION) {
              console.error(JSON.stringify({ expected: process.env.EXPECTED_VERSION, received: payload }));
              process.exit(1);
            }
          '