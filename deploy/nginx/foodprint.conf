upstream foodprint_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name foodprint.com.cn www.foodprint.com.cn;

    return 308 https://foodprint.com.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.foodprint.com.cn;

    ssl_certificate /etc/nginx/ssl/foodprint/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/foodprint/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://foodprint.com.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name foodprint.com.cn;

    ssl_certificate /etc/nginx/ssl/foodprint/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/foodprint/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/foodprint.access.log foodprint_privacy;
    error_log /var/log/nginx/foodprint.error.log warn;

    limit_req zone=foodprint_general burst=20 nodelay;

    location = /api/health {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
