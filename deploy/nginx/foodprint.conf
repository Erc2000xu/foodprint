upstream foodprint_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name foodprint.com.cn www.foodprint.com.cn;

    return 308 https://foodprint.com.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.foodprint.com.cn;

    ssl_certificate /etc/nginx/ssl/foodprint/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/foodprint/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://foodprint.com.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name foodprint.com.cn;

    ssl_certificate /etc/nginx/ssl/foodprint/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/foodprint/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    access_log /var/log/nginx/foodprint.access.log foodprint_privacy;
    error_log /var/log/nginx/foodprint.error.log warn;

    limit_req_status 429;

    location = /api/health {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location ^~ /api/amap/_AMapService/ {
        limit_req zone=foodprint_amap burst=60 nodelay;
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location ^~ /api/ {
        limit_req zone=foodprint_api burst=16 nodelay;
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location ~ ^/(login|forgot-password|reset-password|auth/callback)(?:/|$) {
        limit_req zone=foodprint_auth burst=5 nodelay;
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location ^~ /_next/static/ {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(?:fonts|mascot|nav-icons|icons)/.+\.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|otf)$ {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /service-worker.js {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300" always;
    }

    location = /launch {
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=60" always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=foodprint_pages burst=20 nodelay;
        proxy_pass http://foodprint_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}
