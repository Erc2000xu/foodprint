# Included from the http{} context by Ubuntu's /etc/nginx/nginx.conf.
# Keep query strings, cookies, authorization headers and referers out of access logs.
map $uri $foodprint_log_uri {
    default $uri;
    ~^/join/[^/]+ /join/:token;
}

limit_req_zone $binary_remote_addr zone=foodprint_pages:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=foodprint_api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=foodprint_auth:10m rate=2r/s;

log_format foodprint_privacy '$remote_addr [$time_local] "$request_method $foodprint_log_uri $server_protocol" '
    '$status $body_bytes_sent $request_time $upstream_response_time $upstream_status "$http_user_agent"';
